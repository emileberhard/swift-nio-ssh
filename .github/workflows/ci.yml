name: CI

permissions:
    contents: read

on:
    push:
        branches: [main, agentty-nio-ssh]
    pull_request:
        types: [opened, reopened, synchronize]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    macos:
        name: Build and test (macOS)
        runs-on: macos-26
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Swift version
              run: swift --version
            - name: Build
              run: swift build --build-tests --jobs 4
            - name: Test
              run: swift test --skip-build
